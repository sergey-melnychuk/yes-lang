[package]
name = "yes-lang"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["sergey-melnychuk"]
description = "Yet anothEr Scripting Language"
license = "MIT"
repository = "https://github.com/sergey-melnychuk/yes-lang"
documentation = "https://github.com/sergey-melnychuk/yes-lang"

[dependencies]
num-bigint = "0.5"
num-traits = "0.2"
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"], optional = true }
sha3 = { version = "0.12.0", optional = true }
stacker = "0.1.25"

[features]
default = ["json", "eth"]
# JSON to objects and back
json = ["dep:serde", "dep:serde_json"]
# Ethereum natives: keccak, selector, abi, event
eth = ["dep:sha3"]

[[bin]]
name = "yes-lang"
path = "src/main.rs"
required-features = ["json", "eth"]

[profile.test]
opt-level = 3
overflow-checks = false
