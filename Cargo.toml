[package]
name = "yes-lang"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["sergey-melnychuk"]
description = "Yet anothEr Scripting Language"
license = "MIT"
homepage = "https://github.com/sergey-melnychuk/yes-lang"
repository = "https://github.com/sergey-melnychuk/yes-lang"
documentation = "https://github.com/sergey-melnychuk/yes-lang"

[dependencies]
num-bigint = "0.5"
num-traits = "0.2"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha3 = "0.12.0"
stacker = "0.1.25"

[profile.test]
opt-level = 3
overflow-checks = false
